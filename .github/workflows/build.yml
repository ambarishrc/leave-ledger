name: Build APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
      KEYSTORE_PASSWORD: leaveledger123
      KEY_ALIAS: leave
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android && npx cap sync android
      - run: node scripts/patch-android.cjs
      - run: cd android && ./gradlew assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk LeaveLedger-v${VERSION_NAME}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Leave Ledger ${{ env.VERSION_NAME }}
          files: LeaveLedger-v${{ env.VERSION_NAME }}.apk
